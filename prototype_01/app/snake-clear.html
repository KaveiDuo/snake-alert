<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Snake report — security clearance</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0F0F0F;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.bar{background:#1C1C1C;border-bottom:1px solid #262626;padding:14px 16px;display:flex;align-items:center;gap:10px;font-size:12px;color:#8A8A8A}
.wrap{max-width:520px;margin:0 auto;padding:20px 18px 40px}
.kicker{font-size:11px;font-weight:700;color:#8A8A8A;letter-spacing:.7px}
h1{font-size:24px;font-weight:700;line-height:1.25;margin:8px 0 0}
.badge{display:inline-block;margin-top:12px;padding:5px 11px;border-radius:13px;font-size:10.5px;font-weight:700;letter-spacing:.3px}
.card{margin-top:12px;background:#1B1B1B;border:1px solid #262626;border-radius:18px;padding:14px 16px}
.sp{font-size:16px;font-weight:700}
.meta{font-size:12.5px;color:#B0B0B0;margin-top:4px;line-height:1.5}
.note{font-size:12.5px;color:#DCDCDC;margin-top:10px;line-height:1.6}
.sub{font-size:11px;color:#7A7A7A;margin-top:9px}
a.maps{margin-top:10px;background:#17301F;border:1px solid #235536;border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:11px;text-decoration:none}
a.maps span{flex:1;font-size:13.5px;font-weight:600;color:#B6F0CD}
button{width:100%;border:0;font-family:inherit;cursor:pointer;display:block}
.clear{margin-top:20px;background:#2FD46B;border-radius:20px;padding:19px;font-size:16px;font-weight:700;color:#06210F}
.help{margin-top:10px;background:#1B1B1B;border:1px solid #3A2E14;border-radius:20px;padding:17px;font-size:14.5px;font-weight:600;color:#FFB020}
.fine{font-size:11px;color:#6E6E6E;line-height:1.6;margin-top:14px}
.done{text-align:center;padding:40px 0 0}
.tick{width:70px;height:70px;border-radius:50%;background:#17301F;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.done h2{font-size:22px;margin:0}
.done p{font-size:13.5px;color:#A8A8A8;line-height:1.55;margin:10px 0 0}
.row{background:#1B1B1B;border:1px solid #262626;border-radius:16px;padding:13px 15px;display:flex;align-items:center;gap:11px;margin-top:10px;text-align:left;font-size:12.5px;color:#DCDCDC}
</style>
</head>
<body>
<div class="bar">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2FD46B" stroke-width="1.9"><rect x="5" y="10.5" width="14" height="9.5" rx="2"></rect><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"></path></svg>
<span id="host">onestop.iitg.ac.in</span>
</div>
<div class="wrap" id="app"></div>
<script>
var P = new URLSearchParams(location.hash.slice(1));
function q(k, d) { return P.get(k) || d; }
var REQUIRED = ["id", "sp", "l", "lat", "lng"];
var MISSING = REQUIRED.filter(function (k) { return !P.get(k); });
var R = {
  id: q("id", ""),
  sp: q("sp", ""),
  venom: q("v", "venomous"),
  loc: q("l", ""),
  note: q("n", "No extra details added."),
  lat: q("lat", ""),
  lng: q("lng", ""),
  time: q("ts", "recently")
};
var VEN = { venomous:["VENOMOUS","#26100F","#FF8A8E"], "non-venomous":["NON-VENOMOUS","#17301F","#7FE0A5"] };
var v = VEN[R.venom] || ["UNIDENTIFIED — TREAT AS VENOMOUS","#2A2110","#FFB020"];

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

function renderBroken() {
  document.getElementById("app").innerHTML =
    '<div class="done"><div class="tick" style="background:#2A2110">' +
    '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFB020" stroke-width="2.2" stroke-linecap="round"><path d="M12 4 2.5 20h19z"></path><path d="M12 10v4.5M12 17.3h.01"></path></svg>' +
    '</div><h2>Link incomplete or expired</h2>' +
    '<p>This clearance link does not carry a report, so there is nothing to clear. Please reopen it from the original WhatsApp message.</p>' +
    '<div class="fine">Nothing has been changed. If the report is still open, students can still see the pin.</div></div>';
}

function render() {
  document.getElementById("app").innerHTML =
    '<div class="kicker">SECURITY CLEARANCE</div>' +
    '<h1>Snake report<br>#' + esc(R.id) + '</h1>' +
    '<div class="badge" style="background:' + v[1] + ';color:' + v[2] + '">' + v[0] + ' · NOT YET CLEARED</div>' +
    '<div class="card"><div class="sp">' + esc(R.sp) + '</div>' +
    '<div class="meta">' + esc(R.loc) + '<br>' + esc(R.lat) + ', ' + esc(R.lng) + '</div>' +
    '<div class="note">“' + esc(R.note) + '”</div>' +
    '<div class="sub">Reported ' + esc(R.time) + ' via OneStop · students nearby alerted</div></div>' +
    '<a class="maps" href="https://maps.google.com/?q=' + esc(R.lat) + ',' + esc(R.lng) + '" target="_blank" rel="noopener">' +
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2FD46B" stroke-width="1.9"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"></path><circle cx="12" cy="10" r="2.4"></circle></svg>' +
    '<span>Open in Google Maps</span></a>' +
    '<button class="clear" id="btnClear">Area cleared — safe to pass</button>' +
    '<button class="help" id="btnHelp">Still here — need help</button>' +
    '<div class="fine">One-time link tied to this report. No login or app needed — tapping <b style="color:#8A8A8A">Area cleared</b> removes the pin for every student and notifies the person who reported it.</div>';
  document.getElementById("btnClear").onclick = function(){ done(true); };
  document.getElementById("btnHelp").onclick = function(){ done(false); };
}

function done(cleared) {
  if (cleared) {
    try {
      var k = "onestop.snake.cleared";
      var seen = JSON.parse(localStorage.getItem(k) || "[]");
      if (seen.indexOf(R.id) < 0) seen.push(R.id);
      localStorage.setItem(k, JSON.stringify(seen));
      if (window.BroadcastChannel) {
        var ch = new BroadcastChannel("onestop-snake");
        ch.postMessage({ type: "cleared", id: R.id });
        ch.close();
      }
    } catch (e) {}
  }
  var t = new Date().toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
  document.getElementById("app").innerHTML =
    '<div class="done"><div class="tick" style="background:' + (cleared ? "#17301F" : "#2A2110") + '">' +
    (cleared
      ? '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#2FD46B" stroke-width="2.2" stroke-linecap="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>'
      : '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFB020" stroke-width="2.2" stroke-linecap="round"><path d="M12 4 2.5 20h19z"></path><path d="M12 10v4.5M12 17.3h.01"></path></svg>') +
    '</div><h2>' + (cleared ? "Area marked cleared" : "Escalated") + '</h2>' +
    '<p>' + (cleared
      ? "Report #" + esc(R.id) + " at " + esc(R.loc) + " is now closed at " + t + "."
      : "Report #" + esc(R.id) + " stays open and has been escalated to the control room.") + '</p>' +
    (cleared
      ? '<div class="row"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2FD46B" stroke-width="2"><path d="M5 12.5l4 4 9-9"></path></svg>Pin removed for all students</div>' +
        '<div class="row"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2FD46B" stroke-width="2"><path d="M5 12.5l4 4 9-9"></path></svg>Student who reported it notified</div>'
      : '<div class="row"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFB020" stroke-width="2"><path d="M5 12.5l4 4 9-9"></path></svg>Control room and IITG Hospital notified</div>') +
    '<div class="fine">You can close this page.</div></div>';
}
if (MISSING.length) renderBroken(); else render();
</script>
</body>
</html>
