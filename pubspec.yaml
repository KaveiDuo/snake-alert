name: snake_watch
description: "Onestop · Snake Watch (demo)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  flutter_svg: ^2.3.0
  http: ^1.6.0
  shared_preferences: ^2.5.5
  camera: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/snakes/
    - assets/icons/

  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
